            var B1 = brackets(EDGE), B2 = brackets(EDGE), L1 = leader(), L2 = leader();
            var t1 = box.querySelector(".rfhg-t1"), t2 = box.querySelector(".rfhg-t2"), nm = box.querySelector(".rfhg-name");
