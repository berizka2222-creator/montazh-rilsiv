<!doctype html>
<!-- rf-stat-chart: a dark fintech dashboard in tilted layers, a rolling counter locked to a lime line that kicks up through
     the top of its plot while the axis rescales, then the end point keeps pulsing. Rebuilt from an ultra-skills motion prompt. -->
<html lang="uk" data-composition-id="rf-stat-chart" data-composition-duration="600" data-width="1080" data-height="1920" data-composition-variables='[
  { "id": "company", "type": "string", "label": "Назва компанії (вигадана)", "default": "Company name" },
  { "id": "chip", "type": "string", "label": "Плашка біля назви", "default": "demo" },
  { "id": "label", "type": "string", "label": "Підпис метрики", "default": "Metric name (demo data)" },
  { "id": "start_value", "type": "string", "label": "Лічильник: старт (знак і одиниця лишаються)", "default": "$0" },
  { "id": "end_value", "type": "string", "label": "Лічильник: фінал", "default": "$10,000" },
  { "id": "event", "type": "string", "label": "Подія в точці злету", "default": "Event name" },
  { "id": "bg", "type": "color", "label": "Фон: верх", "default": "#141612" },
  { "id": "bg2", "type": "color", "label": "Фон: середина", "default": "#0c0d0b" },
  { "id": "bg3", "type": "color", "label": "Фон: низ", "default": "#070806" },
  { "id": "surface", "type": "color", "label": "Плашки і графік", "default": "#1c1f18" },
  { "id": "grid", "type": "color", "label": "Лінії сітки (11%)", "default": "#dcffaa" },
  { "id": "ink", "type": "color", "label": "Основний текст", "default": "#f6f8f0" },
  { "id": "muted", "type": "color", "label": "Другорядний текст", "default": "#aab09e" },
  { "id": "accent", "type": "color", "label": "Акцент (лінія, знак)", "default": "#c6f432" },
  { "id": "on_accent", "type": "color", "label": "Текст на акценті", "default": "#0b0d06" },
  { "id": "glow", "type": "color", "label": "Світіння за графіком", "default": "#c6f432" },
  { "id": "seconds", "type": "number", "label": "Тривалість картки, с", "default": 3 }

  <head><meta charset="UTF-8" /><title>rf-stat-chart</title></head>
