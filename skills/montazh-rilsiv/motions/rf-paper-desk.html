<!doctype html>
<!-- rf-paper-desk: paper notes land in stop motion on a green cutting mat, then a red marker circles the drop on the curve
     and scrawls a short phrase. Rebuilt from an ultra-skills motion prompt. -->
<html lang="uk" data-composition-id="rf-paper-desk" data-composition-duration="600" data-width="1080" data-height="1920" data-composition-variables='[
  { "id": "title", "type": "string", "label": "Заголовок нотатки з графіком", "default": "Note title" },

  { "id": "clipping", "type": "color", "label": "Папір вирізки", "default": "#f4efe5" },

  { "id": "seconds", "type": "number", "label": "Тривалість картки, с", "default": 2 }

  <head><meta charset="UTF-8" /><title>rf-paper-desk</title></head>

            // ---- slip: cut ink paper with rough edges

            rnd = mulberry32(2104);
            for (k = 0; k <= 16; k++) pts.push((k * 100 / 16).toFixed(2) + "% " + (rnd() * 7).toFixed(1) + "%");
            for (k = 0; k <= 4; k++) pts.push((100 - rnd() * 1.2).toFixed(2) + "% " + (k * 25).toFixed(1) + "%");
            for (k = 16; k >= 0; k--) pts.push((k * 100 / 16).toFixed(2) + "% " + (100 - rnd() * 7).toFixed(1) + "%");
            for (k = 4; k >= 0; k--) pts.push((rnd() * 1.2).toFixed(2) + "% " + (k * 25).toFixed(1) + "%");

            }
            var DP = toScreen(DROP[0], DROP[1], 130, 370, 820, 780, -2), R = 130;
