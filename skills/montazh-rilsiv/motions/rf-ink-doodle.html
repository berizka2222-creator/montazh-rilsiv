<!doctype html>
<!-- rf-ink-doodle: a boiling marker stick figure at a typewriter under a self-lettering paper sign, crumpled sheets turn

<html lang="uk" data-composition-id="rf-ink-doodle" data-composition-duration="600" data-width="1080" data-height="1920" data-composition-variables='[
  { "id": "sign_line1", "type": "string", "label": "Табличка: рядок 1", "default": "SIGN LINE ONE" },

  { "id": "accent", "type": "color", "label": "Червона ручка", "default": "#e5432d" },
  { "id": "seconds", "type": "number", "label": "Тривалість картки, с", "default": 2 }
]'>

            var ulW = Math.min(640, Math.max(200, L2.t.getComputedTextLength() + 30));
            var ul = el("path", { d: hand([[540 - ulW / 2, 575], [540 - ulW / 6, 581], [540 + ulW / 6, 572], [540 + ulW / 2, 579]], false, 1.5), fill: "none", stroke: C.red,

            for (var kr = 0; kr < 3; kr++) for (var kk = 0; kk < 6; kk++) el("circle", { cx: 590 + kk * 32 + kr * 8, cy: 1012 + kr * 20, r: 5, fill: C.ink }, scn);

              var d = hand(pts, true, 0); d += " M" + (-20 + r2() * 10).toFixed(0) + " " + (-18 + r2() * 8).toFixed(0) + " L" + (6 + r2() * 8).toFixed(0) + " " + (-2 + r2() * 8).toFixed(0) +
                " L" + (-4 + r2() * 8).toFixed(0) + " " + (18 + r2() * 8).toFixed(0) + " M" + (10 + r2() * 6).toFixed(0) + " " + (-24 + r2() * 6).toFixed(0) + " L" + (24 + r2() * 4).toFixed(0) + " " + (4 + r2() * 6).toFixed(0);

            el("path", inkAt({ d: seg(-200, -105, 180, -106) + " " + seg(-200, -70, 120, -69), stroke: C.ink, opacity: .35 }), slapG);
            var word = el("text", { x: 0, y: 30, "text-anchor": "middle", fill: C.ink, class: "rfid-hand", "font-size": 60 }, slapG);

            var wfs = 60; while (wfs > 26 && word.getComputedTextLength() > 420) { wfs -= 2; word.setAttribute("font-size", wfs); }
