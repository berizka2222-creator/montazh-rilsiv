                  star.visible = true; star.position.set(mid.x, -mid.y, 0); star.rotation.z = -Math.atan2(mid.ty, mid.tx);
                  star.scale.set(L, W, 1); star.material.uniforms.uI.value = 1 - k * 0.9; star.material.uniforms.uE.value = 1 + k * 0.5;
                } else star.visible = false;
                // ribbon: from the star along the path, length grows with the clock
                var rl = f < 12 ? 0 : 30 * (ck - 36), ra = f < 12 ? 0 : cl((f - 12) / 3, 0, 1) * (f > 36 ? Math.max(0, 1 - (f - 36) / 7) : 1);
                ribbon.visible = ra > 0.001 && rl > 2; ribbon.material.uniforms.uA.value = ra;
                ribbon.material.uniforms.uHot.value = f < 28 ? 0 : (f < 36 ? (1 - (f - 28) / 8) * 0.8 : 0);
                if (ribbon.visible) {
                  var pos = ribGeo.attributes.position.array, aS = ribGeo.attributes.aS.array, aSide = ribGeo.attributes.aSide.array, aBack = ribGeo.attributes.aBack.array;
                  var s0 = sg, s1 = Math.min(LTOT, sg + rl);
                  for (var j = 0; j < ribN; j++) {
                    var u = j / (ribN - 1), pp = at(s0 + (s1 - s0) * u), tl2 = Math.hypot(pp.tx, pp.ty) || 1, nx = -pp.ty / tl2, ny = pp.tx / tl2;
                    var hw = (13 - 7 * u) * (f > 28 ? 1 + (f - 28) / 8 * 0.6 : 1);
                    for (var sd = 0; sd < 2; sd++) { var o = j * 2 + sd, sgn = sd ? 1 : -1;
                      pos[o * 3] = pp.x + nx * hw * sgn; pos[o * 3 + 1] = -(pp.y + ny * hw * sgn); pos[o * 3 + 2] = 0;
                      aS[o] = u; aSide[o] = sgn; aBack[o] = pp.back; }
                  }
                  ribGeo.attributes.position.needsUpdate = ribGeo.attributes.aS.needsUpdate = ribGeo.attributes.aSide.needsUpdate = ribGeo.attributes.aBack.needsUpdate = true;
                }
                // sparks
                var spA = cl((f - 40) / 6, 0, 1); sparks.visible = spA > 0; sparks.material.uniforms.uA.value = spA;
                if (sparks.visible) { var spp = sparks.geometry.attributes.position.array, spb = sparks.geometry.attributes.aBack.array;
                  for (j = 0; j < spN; j++) { var dsp = spData[j], th2 = dsp.th + ck * dsp.w, s2 = disk2scr(dsp.r, th2);
                    spp[j * 3] = s2[0]; spp[j * 3 + 1] = -s2[1]; spp[j * 3 + 2] = 0; spb[j] = Math.sin(th2) < 0 ? 1 : 0; }
                  sparks.geometry.attributes.position.needsUpdate = sparks.geometry.attributes.aBack.needsUpdate = true; }
                R.render(scene, cam);
              }
              root.style.opacity = cl((secs * FPS - f) / (0.25 * FPS), 0, 1);
            }
            // st.f is an accessor: every value GSAP writes (seek with or without events) redraws the frame
            var st = { _f: 0, get f() { return this._f; }, set f(x) { this._f = x; draw(x); } }, tl = gsap.timeline({ paused: true });
            tl.to(st, { f: secs * FPS, duration: secs, ease: "none", lazy: false }, 0);
            draw(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["rf-deep-time"] = tl;
          })();
        </script>
      </div>
