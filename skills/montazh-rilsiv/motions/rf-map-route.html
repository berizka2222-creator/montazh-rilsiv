            var pCone = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.95, 24), pinMat); pCone.rotation.x = Math.PI; pCone.position.y = 0.55; pin.add(pCone);
            var pDot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 10), new THREE.MeshBasicMaterial({ color: col(C.surface) })); pDot.position.y = 1.1; pDot.position.z = 0.27; pin.add(pDot);
            pHead.castShadow = pCone.castShadow = true; pin.position.set(DP[0], 0, DP[1]); scene.add(pin);
            ringD.position.set(DP[0], 0.09, DP[1]);

            // ---------- camera path ----------
            var D2R = Math.PI / 180, F89 = 89 / 30;
            var K0 = { tx: -3.3, tz: 8.6, d: 11.5, el: 21, az: -34 }, K1 = { tx: -3.6, tz: 2.0, d: 21, el: 48, az: -20 }, K2 = { tx: -0.6, tz: -0.4, d: 60, el: 60, az: -10 };
            function camAt(t) {
              var f = t * 30, e1 = backOut((f - 30) / 32, 0.9), e2 = ioSine((f - 56) / 22), r = {};
              for (var k in K0) { var k0 = k === "d" ? lerp(11.5, 10.6, cl(f / 30)) : K0[k]; r[k] = lerp(lerp(k0, K1[k], e1), K2[k], e2); }
              // during the tilt the look-at point rides just ahead of the route head, so the drawing stays in frame
              var wh = ioSine((f - 30) / 14) * (1 - e2);
              if (wh > 0) { var hp0 = headAt(Math.min(NS, routeIndex(t) + 40)); r.tx = lerp(r.tx, hp0[0], wh * 0.8); r.tz = lerp(r.tz, hp0[1], wh * 0.8); }
              r.az += 1.5 * ioSine((f - 78) / 11) + (t > F89 ? 0.35 * (t - F89) : 0);
              return r;
            }
            function headAt(ix) { var i0 = Math.floor(ix), i1 = Math.min(NS, i0 + 1), fr = ix - i0; return [lerp(path[i0][0], path[i1][0], fr), lerp(path[i0][1], path[i1][1], fr)]; }
            var vP = new THREE.Vector3();
            function proj(x, y, z) { vP.set(x, y, z).project(camera); return [(vP.x + 1) / 2 * W, (1 - vP.y) / 2 * H, vP.z]; }
            function clampX(x, w) { return Math.max(60, Math.min(1020 - w, x)); }
            function clampY(y, h) { return Math.max(220, Math.min(1536 - h, y)); }

            draw = function () {
              var t = Math.min(secs, Math.max(0, st.t)), f = t * 30;
              var c = camAt(t), el = c.el * D2R, az = c.az * D2R;
              camera.position.set(c.tx + c.d * Math.cos(el) * Math.sin(az), c.d * Math.sin(el), c.tz + c.d * Math.cos(el) * Math.cos(az));
              camera.lookAt(c.tx, 0, c.tz); camera.updateMatrixWorld();
              // route progress
              var ri2 = routeIndex(t), seg = Math.floor(ri2);
              ribGeo.setDrawRange(0, seg * 18); glowGeo.setDrawRange(0, seg * 12);
              var pa = path[Math.min(NS, seg)], pb = path[Math.min(NS, seg + 1)], fr2 = ri2 - seg;
              var hx = lerp(pa[0], pb[0], fr2), hz = lerp(pa[1], pb[1], fr2), hy = 0.012 + yAt(hx, hz) + 0.08;
              var showHead = f >= 30;
              head.visible = halo.visible = showHead;
              head.position.set(hx, hy, hz); halo.position.set(hx, hy + 0.02, hz);
              halo.material.opacity = 0.85 * (f >= 72 ? Math.max(0.35, 1 - (f - 72) / 10) : 1);
              // origin rings: pulse every 18 frames
              [[ringA, 0], [ringB, 5]].forEach(function (R) {
                var ph = (((f - R[1]) % 18) + 18) % 18 / 18; var sc2 = 0.42 + ph * 1.7;
                R[0].scale.set(sc2, sc2, sc2); R[0].material.opacity = 0.6 * Math.pow(1 - ph, 1.6) * (f >= R[1] ? 1 : 0);
              });
              // destination pin: drop at frame 72 (120px ~ 2 units), one ring, small settle
              var td = (f - 72) / 30;
              if (td < 0) { pin.visible = false; ringD.visible = false; }
              else {
                pin.visible = true; var yoff;
                if (td < 0.2) { var u2 = td / 0.2; yoff = 2.1 * (1 - u2 * u2); pin.scale.set(1, 1, 1); }
                else { var tb = td - 0.2; yoff = 0.2 * Math.exp(-9 * tb) * Math.abs(Math.sin(16 * tb)); var sq = 1 - 0.12 * Math.exp(-14 * tb) * Math.cos(24 * tb); pin.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq)); }
                pin.position.y = yoff;
                var tr = td - 0.2; ringD.visible = tr > 0;
                if (tr > 0) { var ph2 = cl(tr / 0.6), s3 = 0.4 + ph2 * 2.3; ringD.scale.set(s3, s3, s3); ringD.material.opacity = 0.65 * Math.pow(1 - ph2, 1.4); }
              }
              renderer.render(scene, camera);

              // ---- labels projected from 3D points ----
              var ts = (f - 56) / 30;
              if (ts <= 0) elStreet.style.opacity = 0;
              else {
                var k1 = cl(ts / 0.4), sp = proj(-1.2, 0.09, -3.1);
                var sx = clampX(sp[0] - wStreet / 2, wStreet), sy = clampY(sp[1] - hStreet - 14, hStreet);
                elStreet.style.opacity = cl(k1 * 2.5);
                elStreet.style.transform = "translate(" + sx.toFixed(1) + "px," + sy.toFixed(1) + "px) perspective(700px) rotateX(" + (88 * (1 - backOut(k1, 1.3))).toFixed(2) + "deg)";
              }
              var tdl = (f - 75) / 30;
              if (tdl <= 0) elDest.style.opacity = 0;
              else {
                var k2 = cl(tdl / 0.3), hp = proj(DP[0], 1.1 + pin.position.y, DP[1]);
                var lx2 = hp[0] + 48; if (lx2 + wDest > 1020) lx2 = hp[0] - 48 - wDest;
                lx2 = clampX(lx2, wDest); var ly2 = clampY(hp[1] - hDest / 2, hDest);
                elDest.style.opacity = cl(k2 * 3);
                elDest.style.transform = "translate(" + lx2.toFixed(1) + "px," + ly2.toFixed(1) + "px) scale(" + (0.4 + 0.6 * backOut(k2, 2.2)).toFixed(3) + ")";
              }
              var tc = (f - 74) / 30;
              if (tc <= 0) elChip.style.opacity = 0;
              else {
                var k3 = cl(tc / 0.35);
                elChip.style.opacity = cl(k3 * 2);
                elChip.style.transform = "translate(" + ((W - wChip) / 2).toFixed(1) + "px," + (232 + 14 * (1 - ioCubic(k3))).toFixed(1) + "px) scale(" + (0.9 + 0.1 * backOut(k3, 1.6)).toFixed(3) + ")";
              }
              box.style.opacity = fadeOut(t);
            };
            draw();
          })();
        </script>
      </div>
    </template>
