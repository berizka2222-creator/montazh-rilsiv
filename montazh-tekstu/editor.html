<style>
:root{--bg:#0b100b;--panel:#121812;--line:#243024;--ink:#EEF0E6;--mut:#8e978a;--a1:#D2DB76;--a2:#FFC3CC}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Gilroy,system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr 300px;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
header b{font-weight:700;letter-spacing:-.01em}
header .sp{flex:1}
button{font:inherit;color:var(--ink);background:#1b231b;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--a1)}
button.pri{background:var(--a1);color:#0b100b;border-color:var(--a1);font-weight:700}
main{display:grid;grid-template-columns:var(--sw,440px) minmax(360px,1fr);min-height:0;min-width:0}
#stageWrap{position:relative;overflow:hidden;min-height:0;min-width:0}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center;background:#000;overflow:hidden}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.safe{position:absolute;left:0;right:0;border-top:2px dashed rgba(210,219,118,.35);pointer-events:none}
#insp{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 18px}
#insp.cols{column-width:300px;column-gap:28px;column-fill:auto;height:100%}
#insp.cols>*{break-inside:avoid}#insp.cols h3{break-after:avoid}#insp.cols .row,#insp.cols .grid3,#insp.cols .chips{break-inside:avoid}
#packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0}
#packs .pk{margin:0;padding:8px!important;display:flex;flex-direction:column;gap:6px}
#packs .pk img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:#000;display:block}
#packs .pk span{font-size:11px}
#insp h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
#insp label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px}
#insp input,#insp select,#insp textarea{width:100%;font:inherit;color:var(--ink);background:#0c120c;border:1px solid var(--line);border-radius:7px;padding:7px 8px}
#insp input[type=range]{padding:0;accent-color:var(--a1)}
#insp input[type=color]{height:34px;padding:2px}
#insp textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.chip:hover{transform:scale(1.12)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{font-size:12px;padding:8px 6px;text-align:center;border-radius:8px;border:1px solid var(--line);background:#0c120c;cursor:pointer;color:var(--ink)}
.opt.on{border-color:var(--a1);background:#202a12}
footer{border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto 1fr;min-height:0}
#tbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
#tc{font-family:Mono,monospace;color:var(--a1);min-width:120px}
#tl{position:relative;overflow:auto}
#ruler,.track{position:relative;height:30px;border-bottom:1px solid #1a221a;margin-left:130px}
.tname{position:absolute;left:-130px;width:122px;top:0;height:30px;display:flex;align-items:center;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px}
#ruler{cursor:pointer}
#ruler span{position:absolute;top:8px;font:11px Mono,monospace;color:var(--mut)}
.seg{position:absolute;top:4px;height:22px;background:#2a3a2a;border:1px solid #3d523d;border-radius:5px;font-size:11px;padding:2px 6px;color:var(--mut);overflow:hidden;cursor:pointer}
.seg.sel{border-color:var(--a1)}
.bar{position:absolute;top:4px;height:22px;background:rgba(210,219,118,.18);border:1px solid rgba(210,219,118,.6);border-radius:5px;font-size:11px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.bar.sel{background:rgba(210,219,118,.45);color:#fff}
.bar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
#play{position:absolute;top:0;width:2px;background:var(--a2);margin-left:130px;pointer-events:none;z-index:5;box-shadow:0 0 6px rgba(255,195,204,.6)}
#play::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--a2)}
/* рамка вибраного рядка на відео */
#selbox{position:absolute;border:3px solid var(--a1);border-radius:6px;pointer-events:none;z-index:50;display:none}
#selbox i{position:absolute;width:34px;height:34px;background:var(--a1);border:4px solid #0b100b;border-radius:50%;pointer-events:auto}
#selbox .br{right:-19px;bottom:-19px;cursor:nwse-resize}
#selbox .rr{right:-19px;top:calc(50% - 17px);cursor:ew-resize;border-radius:8px;width:22px;right:-13px}
#selbox .e{display:none}
#selbox.bg .e{display:block} #selbox.bg .rr,#selbox.bg .br{display:none}
#selbox .e{width:44px;height:44px}
#selbox .n{top:8px;left:calc(50% - 22px);cursor:ns-resize} #selbox .s{bottom:8px;left:calc(50% - 22px);cursor:ns-resize}
#selbox .w{left:8px;top:calc(50% - 22px);cursor:ew-resize} #selbox .ee{right:8px;top:calc(50% - 22px);cursor:ew-resize}
#selbox .nw{left:8px;top:8px;cursor:nwse-resize} #selbox .ne{right:8px;top:8px;cursor:nesw-resize}
#selbox .sw{left:8px;bottom:8px;cursor:nesw-resize} #selbox .se{right:8px;bottom:8px;cursor:nwse-resize}

.L{position:absolute;white-space:pre-wrap;will-change:transform,opacity;cursor:move}
.L .acc{color:var(--a1)}
.L .serif{font-family:var(--f2,"Nyght Serif","Playfair Display");font-style:var(--f2s,italic);font-weight:var(--f2w,300);letter-spacing:var(--f2ls,-.01em);color:var(--a2);text-transform:none}
.L .ol{color:transparent;-webkit-text-stroke:var(--olw,.028em) var(--a1)}
.L .hl{background:var(--a1);color:var(--hlc,#0b100b);padding:0 .14em;border-radius:.06em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pk{text-align:left!important;margin-bottom:8px;padding:10px 12px!important}.pk span{color:var(--mut);font-size:12px;line-height:1.35}
.D{position:absolute;cursor:move}.D svg{width:100%;height:100%;display:block;overflow:visible}
.L .w,.L .ch,.L .ln{display:inline}
.L .w,.L .ch{display:inline-block}
.L .strike{position:relative;display:inline-block}
.L .strike::after{content:"";position:absolute;left:-4px;top:52%;height:.12em;background:var(--a2);width:calc(var(--sp,0)*(100% + 8px));transform:rotate(-6deg);border-radius:3px}

.L.pl-stamp,.L.pl-receipt,.L.pl-torn{width:fit-content!important;background-repeat:no-repeat}
.L.pl-receipt:has(.sp){width:auto!important}
.pl-stamp{padding:.55em .75em}.pl-receipt{padding:.6em .9em 1.7em}.pl-torn{padding:.45em .7em}
.L .sp{flex:1;border-bottom:.06em dotted currentColor;margin:0 .35em .28em;opacity:.55;min-width:1em}
.L .ln:has(.sp){display:flex!important;align-items:flex-end}
.pl-ticket{background:var(--pc);padding:.22em .8em;border-radius:.12em;clip-path:polygon(0 0,100% 0,100% calc(50% - 0.32em),calc(100% - 0.000em) calc(50% - 0.320em),calc(100% - 0.099em) calc(50% - 0.304em),calc(100% - 0.188em) calc(50% - 0.259em),calc(100% - 0.259em) calc(50% - 0.188em),calc(100% - 0.304em) calc(50% - 0.099em),calc(100% - 0.320em) calc(50% - 0.000em),calc(100% - 0.304em) calc(50% - -0.099em),calc(100% - 0.259em) calc(50% - -0.188em),calc(100% - 0.188em) calc(50% - -0.259em),calc(100% - 0.099em) calc(50% - -0.304em),calc(100% - 0.000em) calc(50% - -0.320em),100% calc(50% + 0.32em),100% 100%,0 100%,0 calc(50% + 0.32em),0.000em calc(50% + 0.320em),0.099em calc(50% + 0.304em),0.188em calc(50% + 0.259em),0.259em calc(50% + 0.188em),0.304em calc(50% + 0.099em),0.320em calc(50% + 0.000em),0.304em calc(50% + -0.099em),0.259em calc(50% + -0.188em),0.188em calc(50% + -0.259em),0.099em calc(50% + -0.304em),0.000em calc(50% + -0.320em),0 calc(50% - 0.32em));outline:.05em dashed currentColor;outline-offset:-.24em;width:fit-content!important}

.pl-outline{border:.07em solid var(--pc);border-radius:var(--pr,16px);padding:.16em .45em}

.pl-brutal{background:var(--pc);border:.05em solid #0b100b;border-radius:var(--pr,8px);padding:.16em .45em;box-shadow:.12em .12em 0 #0b100b}
.pl-tape{background:var(--pc);padding:.12em .6em;clip-path:polygon(2% 8%,98% 0,100% 92%,0 100%)}
.pl-grad{background:linear-gradient(100deg,var(--pc),var(--pc2,#FFC3CC));border-radius:var(--pr,16px);padding:.18em .5em}
.pl-glow{text-shadow:0 0 .5em var(--pc),0 0 1.2em var(--pc)!important}
.pl-line span.ln{background:var(--pc);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:.06em .3em;border-radius:var(--pr,10px)}
.pl-marker span.ln{background:linear-gradient(transparent 55%,var(--pc) 55%);background-size:calc(var(--mp,1)*100%) 100%;background-repeat:no-repeat;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pl-under span.ln{background:linear-gradient(var(--pc),var(--pc)) left bottom/calc(var(--mp,1)*100%) .12em no-repeat;padding-bottom:.08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
body.render{background:#000;display:block}
body.render header,body.render footer,body.render #insp,body.render #selbox{display:none!important}
body.render main{display:block}
body.render #stageWrap{padding:0;display:block;overflow:visible}

body.render .safe{display:none}
.B,.M{position:absolute;cursor:move}
.M img,.M video{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.mbtn{position:relative;overflow:hidden}.mbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

function dragOnStage(e,i,mode){ e.preventDefault(); const sc=stageScale(), L=P.layers[i], x0=e.clientX, y0=e.clientY;
  const lx=L.x, ly=L.y, s0=L.size, w0=L.w||952, h0=L.h||0, d=document.querySelector(`#stage [data-i="${i}"]`), bw=d?d.offsetWidth:w0;
  const mv=ev=>{ const dx=(ev.clientX-x0)/sc, dy=(ev.clientY-y0)/sc;
    if(mode==="move"){ L.x=Math.round(lx+dx); L.y=Math.round(ly+dy); }
    if(mode==="scale"){ if(L.kind==="bg"||L.kind==="deco"){ L.w=Math.max(60,Math.round(w0+dx)); L.h=Math.max(60,Math.round(h0+dy)); }
      else if(L.kind==="media"){ const k=Math.max(0.1,(w0+dx)/w0); L.w=Math.round(w0*k); L.h=Math.round(h0*k); }
      else { const k=Math.max(0.2,(bw+dx)/bw); L.size=Math.round(s0*k); L.w=Math.round(w0*k); } }
    if(mode==="width"){ L.w=Math.max(120,Math.round(w0+dx)); }
    if(mode.startsWith("edge:")){ const dd=mode.slice(5);
      if(dd.includes("e")) L.w=Math.max(40,Math.round(w0+dx));
      if(dd.includes("s")) L.h=Math.max(40,Math.round(h0+dy));
      if(dd.includes("w")){ const nw=Math.max(40,Math.round(w0-dx)); L.x=Math.round(lx+w0-nw); L.w=nw; }
      if(dd.includes("n")){ const nh=Math.max(40,Math.round(h0-dy)); L.y=Math.round(ly+h0-nh); L.h=nh; } }
    build(); draw(); };
  const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); };
  addEventListener("mousemove",mv); addEventListener("mouseup",up); }

/* ======== ПРЕВ'Ю: плавний хід ======== */
let T=0, playing=false, t0=0, T0=0;
function seek(t){ T=clamp(t,0,outDur()); V.currentTime=outToSrc(T).src; draw(); }
function syncMatte(){ if(!P.matte) return; const M=$("#mv"); if(playing){ if(M.paused) M.play().catch(()=>{}); if(Math.abs(M.currentTime-V.currentTime)>0.08) M.currentTime=V.currentTime; } else { if(!M.paused) M.pause(); if(Math.abs(M.currentTime-V.currentTime)>0.02) M.currentTime=V.currentTime; } }
function draw(){ applyAt(T); syncMatte(); $("#tc").textContent=fmt(T)+" / "+fmt(outDur());
  const pl=$("#play"); pl.style.left=(T*PX)+"px"; pl.style.height=$("#tl").scrollHeight+"px";
  if(playing){ const tl=$("#tl"), x=T*PX+130; if(x>tl.scrollLeft+tl.clientWidth-60||x<tl.scrollLeft+130) tl.scrollLeft=x-200; } }
const fmt=t=>Math.floor(t/60)+":"+(t%60).toFixed(1).padStart(4,"0");
function loop(now){ if(playing){ T=T0+(now-t0)/1000;
    if(T>=outDur()){ T=outDur(); playing=false; V.pause(); $("#pp").textContent="▶︎"; }
    else { const src=outToSrc(T).src; if(Math.abs(V.currentTime-src)>0.2) V.currentTime=src; }
    draw(); } requestAnimationFrame(loop); }
function play(on){ playing=on; $("#pp").textContent=on?"❚❚":"▶︎";
  if(on){ if(T>=outDur()-0.05) seek(0); T0=T; t0=performance.now(); V.currentTime=outToSrc(T).src; V.play().catch(()=>{}); } else V.pause(); }
$("#pp").onclick=()=>play(!playing);

/* ======== ТАЙМЛАЙН ======== */
function timeline(){
  const W=outDur()*PX+200; $("#ruler").innerHTML=""; $("#ruler").style.width=W+"px";
  for(let s=0;s<=outDur();s++){ const e=document.createElement("span"); e.style.left=(s*PX)+"px"; e.textContent=s+"с"; $("#ruler").appendChild(e); }
  const tr=$("#tracks"); tr.innerHTML="";
  const vt=document.createElement("div"); vt.className="track"; vt.style.width=W+"px"; vt.innerHTML='<div class="tname">🎬 Відео</div>';
  let acc=0; P.segments.forEach((s,i)=>{ if(s.removed) return; const d=s.out-s.in; const e=document.createElement("div"); e.className="seg"+(sel&&sel.kind==="seg"&&sel.i===i?" sel":"");
    e.style.left=acc*PX+"px"; e.style.width=Math.max(4,d*PX-2)+"px"; e.textContent=`${s.in.toFixed(1)}–${s.out.toFixed(1)}с`; e.onclick=()=>select({kind:"seg",i}); vt.appendChild(e); acc+=d; });
  tr.appendChild(vt);
  P.layers.forEach((L,i)=>{ const t=document.createElement("div"); t.className="track"; t.style.width=W+"px";
    const nm=L.kind==="deco"?"✎ "+(SHAPES[L.shape]||["Декор"])[0]:L.kind==="bg"?"▦ "+(BGS.find(b=>b[0]===L.preset)||["","Фон"])[1]:L.kind==="media"?(L.mtype==="video"?"▶ Відео":"🖼 Картинка"):L.text.replace(/[*_~]/g,"").replace(/\n/g," ");
    t.innerHTML=`<div class="tname" title="${nm}">${i+1}. ${nm}</div>`;
    const b=document.createElement("div"); b.className="bar"+(sel&&sel.kind==="layer"&&sel.i===i?" sel":""); b.style.left=L.start*PX+"px"; b.style.width=Math.max(10,(L.end-L.start)*PX)+"px";
    b.innerHTML='<i class="h l"></i>'+nm+'<i class="h r"></i>';
    b.ondblclick=()=>{ const x=$("#tx"); if(x){x.focus();x.select();} };
    b.onmousedown=e=>{ select({kind:"layer",i}); dragBar(e,i, e.target.classList.contains("l")?"l":e.target.classList.contains("r")?"r":"m"); };
    t.appendChild(b); tr.appendChild(t); });
  draw();
}
function dragBar(e,i,mode){ e.preventDefault(); const L=P.layers[i], x0=e.clientX, s0=L.start, e0=L.end;
  const mv=ev=>{ const dt=Math.round((ev.clientX-x0)/PX*10)/10;
    if(mode==="m"){ const d=e0-s0; L.start=+clamp(s0+dt,0,outDur()-d).toFixed(2); L.end=+(L.start+d).toFixed(2); }
    if(mode==="l") L.start=+clamp(s0+dt,0,L.end-0.2).toFixed(2); if(mode==="r") L.end=+clamp(e0+dt,L.start+0.2,outDur()).toFixed(2);
    timeline(); };
  const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); };
  addEventListener("mousemove",mv); addEventListener("mouseup",up); }
$("#tl").onmousedown=e=>{ if(e.target.closest(".bar,.seg,.tname")) return; const r=$("#ruler").getBoundingClientRect();
  const go=ev=>seek((ev.clientX-r.left)/PX); go(e);
  const up=()=>{ removeEventListener("mousemove",go); removeEventListener("mouseup",up); }; addEventListener("mousemove",go); addEventListener("mouseup",up); };

/* ======== ПАЛІТРА: кольори накопичуються ======== */
function remember(c){ if(!c) return; P.palette=P.palette||[]; c=c.toLowerCase(); if(!P.palette.includes(c)){ P.palette.unshift(c); P.palette=P.palette.slice(0,16); } }
function hexOf(c){ if(!c) return "#ffffff"; if(c.startsWith("#")) return c.slice(0,7); const m=c.match(/\d+/g); return m?"#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join(""):"#ffffff"; }
function alphaOf(c){ const m=(c||"").match(/rgba\([^)]*,\s*([\d.]+)\)/); return m?+m[1]:1; }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return a>=1?hex:`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function chips(id){ return `<div class="chips" data-for="${id}">${(P.palette||[]).map(c=>`<button class="chip" style="background:${c}" data-c="${c}" title="${c}"></button>`).join("")}</div>`; }

/* ======== ІНСПЕКТОР ======== */
function select(s){ sel=s; timeline(); inspector(); }
const opt=(v,list)=>list.map(([k,n])=>`<option value="${k}"${k===v?" selected":""}>${n}</option>`).join("");
function inspector(){
  const I=$("#insp"); I.classList.toggle("cols",!!sel);
  if(!sel){ return stylePanel(); }
  if(sel.kind==="seg"){ const s=P.segments[sel.i];
    I.innerHTML=`<h3>Шматок відео</h3><div class="row"><div><label>Початок у вихіднику, с</label><input id="si" type="number" step=".1" value="${s.in}"></div>
    <div><label>Кінець у вихіднику, с</label><input id="so" type="number" step=".1" value="${s.out}"></div></div>
    <div class="hint">Підріж початок чи кінець або прибери шматок. Різати — кнопка ✂ або S на потрібному місці.</div>
    <h3>Дії</h3><button id="srm">Прибрати шматок</button>`;
    $("#si").onchange=e=>{s.in=+e.target.value;timeline();seek(T)}; $("#so").onchange=e=>{s.out=+e.target.value;timeline();seek(T)};
    $("#srm").onclick=()=>{s.removed=true;sel=null;timeline();inspector();seek(Math.min(T,outDur()))}; return; }
  const L=P.layers[sel.i], fx=L.effect||{type:"none"}, ai=L.in||{type:"fade-up",dur:.4}, ao=L.out||{type:"fade",dur:.3};
  if (L.kind==="deco") return inspectorDeco(L,ai,ao);
  if (L.kind==="bg"||L.kind==="media") return inspectorOther(L,ai,ao);
  const pc=L.plateColor||"#D2DB76";
  I.innerHTML=`<h3>Рядок ${sel.i+1}</h3>
  <label>Текст · *колір*, _другий шрифт_, ==виділення==, ^контур^, ~~перекреслено~~, Enter — новий рядок</label><textarea id="tx">${L.text.replace(/</g,"&lt;")}</textarea>
  <h3>Текст</h3>
  <div class="row"><div><label>Роль у ролику</label><select id="rl">${opt(L.role||guessRole(L),ROLES)}</select></div><div></div></div>
  <div class="row"><div><label>Шрифт</label>${fontSel("fn",L.font||"head")}</div>
  <div><label>Товщина</label><select id="fw">${opt(String(L.weight||(FONTS[L.font||"head"]||FONTS.head)[2]),WEIGHTS)}</select></div></div>
  <div class="row"><div><label>Шрифт для _…_</label>${fontSel("fn2",L.font2||"serif")}</div>
  <div><label>Між літерами</label><input id="ls" type="range" min="-0.08" max="0.4" step="0.01" value="${L.ls??parseFloat((FONTS[L.font||"head"]||FONTS.head)[3])}"></div></div>
  <div class="row"><div><label>Міжрядковий</label><input id="lh" type="range" min="0.8" max="1.6" step="0.02" value="${L.lh||1.1}"></div><div></div></div>
  <div class="row"><div><label>Вирівнювання</label><select id="al">${opt(L.align||"left",[["left","зліва"],["center","центр"],["right","справа"]])}</select></div>
  <div><label>Капс</label><select id="up">${opt(L.upper?"1":"0",[["0","ні"],["1","так"]])}</select></div></div>
  <label>Колір тексту</label><input id="cl" type="color" value="${hexOf(L.color||"#F3F4EC")}">${chips("cl")}
  <label>Колір акценту *…*, ==…==, ^…^</label><input id="ac" type="color" value="${hexOf(L.accent||"#D2DB76")}">${chips("ac")}
  <label>Колір _…_</label><input id="ac2" type="color" value="${hexOf(L.accent2||"#FFC3CC")}">${chips("ac2")}
  <label>Нахил, °</label><input id="rt" type="range" min="-15" max="15" step="1" value="${L.rot||0}">
  <h3>Контур тексту</h3>
  <div class="row"><div><label>Товщина</label><input id="sw" type="range" min="0" max="12" step="1" value="${(L.stroke||{}).w||0}"></div>
  <div><label>Лише контур</label><select id="so2">${opt((L.stroke||{}).only?"1":"0",[["0","ні"],["1","так, без заливки"]])}</select></div></div>
  <label>Колір контуру</label><input id="sc" type="color" value="${hexOf((L.stroke||{}).color||"#0b100b")}">${chips("sc")}
  <div class="hint">Розмір — тягни кутик рамки на відео, ширину — правий край, позицію — сам рядок.</div>
  <h3>Підкладка</h3>
  <div class="grid3" id="plates">${PLATES.map(([k,n])=>`<div class="opt${(L.plate||"none")===k?" on":""}" data-k="${k}">${n}</div>`).join("")}</div>
  <label>Колір підкладки</label><input id="pc" type="color" value="${hexOf(pc)}">${chips("pc")}
  <div class="row"><div><label>Прозорість</label><input id="pa" type="range" min="0.1" max="1" step="0.05" value="${alphaOf(pc)}"></div>
  <div><label>Заокруглення</label><input id="pr" type="range" min="0" max="60" step="2" value="${L.radius??16}"></div></div>
  ${L.plate==="grad"?`<label>Другий колір градієнта</label><input id="pc2" type="color" value="${hexOf(L.plateColor2||"#FFC3CC")}">${chips("pc2")}`:""}
  <h3>Поява</h3><select id="ai">${opt(ai.type,INS)}</select>
  <label>Швидкість появи, с</label><input id="ad" type="range" min="0.1" max="1.5" step="0.05" value="${ai.dur}">
  <h3>Зникнення</h3><select id="ao">${opt(ao.type,OUTS)}</select>
  <label>Швидкість зникнення, с</label><input id="od" type="range" min="0.1" max="1.5" step="0.05" value="${ao.dur}">
  <h3>Ефект поки рядок на екрані</h3><select id="fx">${opt(fx.type,FX)}</select><div id="fxo"></div>
  <h3>Дії</h3><div class="row"><button id="dup">Дублювати</button><button id="del">Видалити</button></div>
  <div class="row" style="margin-top:8px"><button id="zup">Вище шаром</button><button id="zdn">Нижче шаром</button></div>`;
  orderBtns();
  if(fx.type==="countup") $("#fxo").innerHTML=`<div class="row"><div><label>Від</label><input id="cf" type="number" value="${fx.from??0}"></div><div><label>До</label><input id="ct" type="number" value="${fx.to??0}"></div></div><div class="row"><div><label>Перед числом</label><input id="cp" value="${fx.prefix||""}"></div><div><label>Після числа</label><input id="cs" value="${fx.suffix||""}"></div></div>`;
  const upd=()=>{ build(); timeline(); };
  const bind=(id,fn,ev)=>{ const el=$("#"+id); if(!el) return; el[ev||"oninput"]=e=>{ fn(e.target.value); upd(); }; };
  bind("tx",v=>L.text=v); bind("fn",v=>{L.font=v; delete L.weight; delete L.ls; inspector();},"onchange"); bind("fw",v=>L.weight=+v,"onchange");
  bind("fn2",v=>L.font2=v,"onchange"); bind("ls",v=>L.ls=+v); bind("lh",v=>L.lh=+v); bind("rl",v=>L.role=v,"onchange"); bind("ac2",v=>L.accent2=v); bind("al",v=>L.align=v); bind("up",v=>L.upper=v==="1");
  bind("cl",v=>L.color=v); bind("ac",v=>L.accent=v); bind("rt",v=>L.rot=+v);
  bind("sw",v=>L.stroke={...(L.stroke||{}),w:+v}); bind("so2",v=>L.stroke={...(L.stroke||{}),only:v==="1"},"onchange"); bind("sc",v=>L.stroke={...(L.stroke||{}),color:v});
  const setPc=()=>{ L.plateColor=rgba($("#pc").value,+$("#pa").value); };
  bind("pc",()=>setPc()); bind("pa",()=>setPc()); bind("pr",v=>L.radius=+v); bind("pc2",v=>L.plateColor2=v);
  ["cl","ac","ac2","pc","pc2","sc"].forEach(id=>{ const el=$("#"+id); if(el) el.onchange=e=>{ remember(e.target.value); inspector(); }; });
  document.querySelectorAll(".chips").forEach(ch=>ch.onclick=e=>{ const c=e.target.dataset.c; if(!c) return; const f=ch.dataset.for;
    if(f==="sc") L.stroke={...(L.stroke||{}),color:c}; if(f==="cl") L.color=c; if(f==="ac") L.accent=c; if(f==="ac2") L.accent2=c; if(f==="pc2") L.plateColor2=c; if(f==="pc") L.plateColor=rgba(c,+$("#pa").value); upd(); inspector(); });
  document.querySelectorAll("#plates .opt").forEach(o=>o.onclick=()=>{ L.plate=o.dataset.k; upd(); inspector(); });
  bind("ai",v=>L.in={...ai,type:v},"onchange"); bind("ad",v=>L.in={...(L.in||ai),dur:+v}); bind("ao",v=>L.out={...ao,type:v},"onchange"); bind("od",v=>L.out={...(L.out||ao),dur:+v});
  $("#ai").addEventListener("change",()=>build()); $("#fx").onchange=e=>{ L.effect={...(L.effect||{}),type:e.target.value}; upd(); inspector(); };
  bind("cf",v=>L.effect.from=+v); bind("ct",v=>L.effect.to=+v); bind("cp",v=>L.effect.prefix=v); bind("cs",v=>L.effect.suffix=v);
  $("#dup").onclick=()=>{ P.layers.splice(sel.i+1,0,JSON.parse(JSON.stringify(L))); sel.i++; upd(); inspector(); };
  $("#del").onclick=()=>{ P.layers.splice(sel.i,1); sel=null; upd(); inspector(); };
}

function orderBtns(){ const mvz=d=>{ const i=sel.i, j=i+d; if(j<0||j>=P.layers.length) return; [P.layers[i],P.layers[j]]=[P.layers[j],P.layers[i]]; sel.i=j; build(); timeline(); inspector(); };
  const u=$("#zup"), dn=$("#zdn"); if(u) u.onclick=()=>mvz(1); if(dn) dn.onclick=()=>mvz(-1);
  if(u){ const L=P.layers[sel.i], w=document.createElement("div"); w.style.marginTop="8px";
    w.innerHTML=P.matte?`<label>Відносно людини</label><select id="bh">${opt(L.behind?"1":"0",[["0","Перед людиною"],["1","За людиною"]])}</select>`
      :`<div class="hint">«За людиною» з'явиться, коли Claude виріже людину з цього відео.</div>`;
    u.parentElement.after(w); const b=$("#bh"); if(b) b.onchange=e=>{ L.behind=e.target.value==="1"; build(); timeline(); draw(); }; } }
function inspectorOther(L,ai,ao){

    <label>Площа</label><div class="grid3" id="bfit">${[["full","Весь кадр"],["bot","Низ ½"],["top","Верх ½"],["left","Ліво ½"],["right","Право ½"],["mid","Середина"]].map(([k,n])=>`<div class="opt" data-k="${k}">${n}</div>`).join("")}</div>
    <div class="hint">Тягни фон на відео. Ручки з усіх боків і по кутах — розтягують у будь-який бік, хоч на весь кадр. «Суцільна частина» — скільки площі залито повністю, перш ніж почнеться перехід. Фон лежить під текстом, порядок — кнопками «Вище / Нижче».</div>`

    <div class="row"><div><label>Прозорість</label><input id="ma" type="range" min="0.1" max="1" step="0.05" value="${L.alpha??1}"></div>
    <div><label>Заокруглення</label><input id="mr" type="range" min="0" max="200" step="4" value="${L.radius||0}"></div></div>

    ${L.mtype==="video"?`<label>Почати шматок з секунди</label><input id="mci" type="number" step=".1" value="${L.clipIn||0}">`:""}
    <div class="hint">Тягни на відео, кутик — розмір зі збереженням пропорцій.</div>
    <h3>Рух поки на екрані</h3><select id="mfx">${opt((L.effect||{}).type||"none",FX.filter(x=>["none","tiltfloat","sway","kenburns","float","pulse","shake"].includes(x[0])))}</select>`)+
   `<h3>Поява</h3><select id="ai">${opt(ai.type,INS.filter(x=>!["lines","letters"].includes(x[0])))}</select>
    <label>Швидкість появи, с</label><input id="ad" type="range" min="0.1" max="1.5" step="0.05" value="${ai.dur}">
    <h3>Зникнення</h3><select id="ao">${opt(ao.type,OUTS)}</select>

    <h3>Дії</h3><div class="row"><button id="dup">Дублювати</button><button id="del">Видалити</button></div>

  const upd=()=>{ build(); timeline(); };

    if(!L.orig){ L.orig=JSON.parse(JSON.stringify({size:L.size,in:L.in,out:L.out,effect:L.effect})); STYLE_KEYS.forEach(k=>{ if(L[k]!==undefined) L.orig[k]=JSON.parse(JSON.stringify(L[k])); }); }

function reflow(){ const T=P.layers.map((L,i)=>({L,i})).filter(o=>!o.L.kind);
  const box=o=>{ const d=document.querySelector(`#stage [data-i="${o.i}"]`); d.style.display=""; let w=d.offsetWidth; if((o.L.plate||"none")==="none"||["line","marker","under"].includes(o.L.plate)){ const lw=Math.max(0,...[...d.querySelectorAll(".ln")].map(l=>l.offsetWidth)); if(lw) w=Math.min(w,lw+(o.L.align==="center"?(d.offsetWidth-lw)/2:0)); }
    const r={x:o.L.x,y:o.L.y,w,h:d.offsetHeight}; return r; };
  T.filter(o=>(o.L.role||guessRole(o.L))==="old").forEach(o=>{ const pr=T.find(p=>(p.L.role||guessRole(p.L))==="price"&&p.L.start<o.L.end&&o.L.start<p.L.end); if(!pr) return;
    const rp=box(pr), ro=box(o); if(rp.x+rp.w+30+ro.w<=1040){ o.L.x=rp.x+rp.w+30; o.L.y=Math.round(rp.y+(rp.h-ro.h)/2); o.L.side=1; } else { o.L.x=rp.x; o.L.y=rp.y+rp.h+16; } });
  for(let pass=0;pass<6;pass++){ let moved=false;
    T.sort((a,b)=>a.L.y-b.L.y||a.L.start-b.L.start);
    for(let a=0;a<T.length;a++) for(let b=a+1;b<T.length;b++){ const A=T[a],B=T[b];
      if(A.L.end<=B.L.start||B.L.end<=A.L.start) continue; if(A.L.side||B.L.side){ const o=A.L.side?A:B, q=A.L.side?B:A; if((q.L.role||guessRole(q.L))==="price") continue; }
      const ra=box(A), rb=box(B); const gap=Math.round(Math.max(20,Math.min(A.L.size,B.L.size)*.35));
      const hx=ra.x<rb.x+rb.w&&rb.x<ra.x+ra.w, vy=rb.y<ra.y+ra.h+gap&&ra.y<rb.y+rb.h;

  build(); }
